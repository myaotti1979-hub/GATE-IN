<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GATE IN">
<title>GATE IN ビューア</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">GATE IN <span>見るだけ</span></div>
  <div id="home" class="home">—</div>
</header>

<section id="login" class="login" hidden>
  <p>家のパソコンが Google ドライブに置いた記録を読みます。<br>読むだけで、買ったり設定を変えたりはしません。</p>
  <button id="signin" class="btn">Google でログイン</button>
  <p class="sub" id="loginMsg"></p>
</section>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="today" class="on">開催日</button>
  <button data-tab="card">出馬表</button>
  <button data-tab="pred">予想</button>
  <button data-tab="pl">収支</button>
  <button data-tab="review">反省会</button>
  <button data-tab="setting">自動投票</button>
</nav>

<main id="main" hidden>
  <section data-view="today">
    <div class="row"><select id="day"></select><button id="reload" class="btn ghost">更新</button></div>
    <div id="dayTotal" class="cards"></div>
    <div id="win5"></div>
    <div id="shobu"></div>
    <h3 id="racesHead">自動投票で買った馬券</h3>
    <div id="races"></div>
  </section>
  <section data-view="card" hidden>
    <div class="row"><select id="cdDay"></select></div>
    <div class="venues" id="cdVenues"></div>
    <div id="cdTop"></div>
    <div id="cards"></div>
  </section>
  <section data-view="pred" hidden>
    <div class="row"><select id="pdDay"></select></div>
    <div id="pdTop"></div>
    <div id="pred"></div>
  </section>
  <section data-view="pl" hidden>
    <div id="plTotal" class="cards"></div>
    <div id="plTable"></div>
  </section>
  <section data-view="review" hidden>
    <div class="row"><select id="rvDay"></select></div>
    <div id="review"></div>
  </section>
  <section data-view="setting" hidden>
    <div id="setting"></div>
  </section>
  <p class="foot" id="foot"></p>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
