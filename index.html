<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GATE IN">
<title>GATE IN ビューア</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("gatein_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<div class="bar">
  <header class="top">
    <div class="brand">GATE IN</div>
    <div class="topr"><div id="home" class="home">—</div><button id="reload" class="rl" type="button">更新</button></div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button type="button" data-tab="today" class="on">今日</button>
    <button type="button" data-tab="race">レース</button>
    <button type="button" data-tab="pl">収支</button>
    <button type="button" data-tab="review">反省会</button>
    <button type="button" data-tab="setting">設定</button>
  </nav>
</div>

<section id="login" class="login" hidden>
  <p>家のパソコンが Google ドライブに置いた記録を読みます。<br>読むだけで、買ったり設定を変えたりはしません。</p>
  <button id="signin" class="btn" type="button">Google でログイン</button>
  <p class="sub" id="loginMsg"></p>
</section>

<main id="main" hidden>
  <section data-view="today">
    <div class="dayrow"><select id="day" aria-label="日付"></select></div>
    <div id="today"></div>
  </section>
  <section data-view="race" hidden>
    <div class="dayrow"><select id="rday" aria-label="日付"></select></div>
    <div class="venues" id="rVenues" hidden></div>
    <div class="rsel" id="rSel"></div>
    <div id="race"></div>
  </section>
  <section data-view="pl" hidden>
    <div id="pl"></div>
  </section>
  <section data-view="review" hidden>
    <div class="dayrow"><select id="rvDay" aria-label="日付"></select></div>
    <div id="review"></div>
  </section>
  <section data-view="setting" hidden>
    <div id="setting"></div>
  </section>
  <p class="foot" id="foot"></p>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
